services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # The API key comes from .env, which is never committed.
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - invoice-data:/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  invoice-data:
